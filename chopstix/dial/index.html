<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>Chopstix Scale Dial</title>
<style>
/* Layout: one centered column — keyboard panel on top, dial plate below, all on a white material surface. */
:root {
  --surface: #f3f3f1;
  --panel: #fbfbfa;
  --seam: #dcdcd8;
  --seam-dark: #c9c9c4;
  --ink: #9a9a95;
  --ink-strong: #55554f;
  --black-key: #2b2b2d;
  --black-key-edge: #1d1d1f;
  --red: #ff2b2b;
  --red-soft: rgba(255, 43, 43, .35);
  --green: #16c060;
  --green-soft: rgba(22, 192, 96, .35);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface);
  color: var(--ink-strong);
  font-family: var(--font);
  overflow: hidden;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
/* Built for an iPad held sideways: everything fits one screen, no scrolling. */
.stage {
  height: 100%; max-width: 1280px; margin: 0 auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-rows: auto minmax(0, 56fr) minmax(0, 44fr); gap: 2vh;
  justify-items: center;
}
.topline { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.title { font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
.sound {
  font: inherit; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
  background: var(--panel); border: 1px solid var(--seam); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.05);
}
.meter { display: none; width: 72px; height: 6px; border-radius: 3px; background: var(--seam); overflow: hidden; margin-right: 10px; }
.meter span { display: block; height: 100%; width: 0%; background: var(--green); transition: width .06s linear; }
.listening .meter { display: inline-block; }
.sens { display: none; align-items: center; gap: 8px; margin-right: 14px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.listening .sens { display: inline-flex; }
.sens input { width: 120px; accent-color: var(--green); }
.mic { display: inline-flex; align-items: center; gap: 8px; margin-right: 8px; }
.mic .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--seam-dark); transition: background .2s, box-shadow .2s, transform .08s; }
.mic[aria-pressed="true"] { color: var(--ink-strong); }
.mic[aria-pressed="true"] .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.heard { margin-right: 14px; font-size: 16px; color: var(--ink-strong); letter-spacing: .02em; white-space: nowrap; }
.heard b { font-weight: 700; }
.heard.err { white-space: normal; color: var(--red); font-size: 14px; max-width: 640px; text-align: right; line-height: 1.35; }
.heard .yes { color: var(--green); }
.heard .no { color: var(--red); }
/* a key that was just heard lights up: green = in the scale, red = not in the scale */
.hitfill { opacity: 0; transition: opacity .35s; pointer-events: none; }
.hit-in .hitfill { fill: var(--green); opacity: 1; transition: none; }
.hit-out .hitfill { fill: var(--red); opacity: 1; transition: none; }
/* the note circle stays crisp and white while its key is lit */
.hit-in .ring, .hit-out .ring { fill: #fff !important; opacity: 1 !important; transition: none; }
.hit-in .lbl, .hit-out .lbl { opacity: 1 !important; }
/* a pressed or played key sinks a little: soft shadow at its top edge */
.press { opacity: 0; transition: opacity .3s; pointer-events: none; }
.pressed .press, .hit-in .press, .hit-out .press { opacity: 1; transition: none; }
.sound-msg { flex: 1; margin: 0 16px; font-size: 14px; color: var(--red); text-align: right; }
.sound[aria-pressed="true"] { color: var(--ink-strong); }
.sound:focus-visible { outline: 2px solid var(--green-soft); outline-offset: 4px; }
.dial:focus { outline: none; }
.focus-ring { opacity: 0; }
.dial:focus-visible .focus-ring { opacity: 1; }
svg { display: block; overflow: visible; max-width: 100%; max-height: 100%; width: auto; height: 100%; }
.keys-wrap, .dial-wrap { width: 100%; min-height: 0; display: flex; justify-content: center; align-items: center; }
.dial { cursor: grab; touch-action: none; }
.dial.dragging { cursor: grabbing; }
.key { cursor: pointer; }
.lbl { font-family: var(--font); font-weight: 600; text-anchor: middle; dominant-baseline: central; transition: fill .25s; }
.ring { transition: stroke .25s, fill .25s; }
.on .lbl { fill: var(--green); }
.on .ring { stroke: var(--green); }
/* notes outside the key fade back so the key's notes stand out */
.key:not(.on) .lbl, .key:not(.on) .ring { opacity: .6; }
.glow { opacity: 0; transition: opacity .3s; }
/* the root (the key's own note) gets a solid green circle; the other scale notes are a green letter */
.root .ring { fill: var(--green) !important; stroke: var(--green) !important; }
.root .lbl { fill: #fff !important; }
.root .glow { opacity: 1; }
.note-name { fill: var(--ink); font-size: 20px; transition: fill .25s; }
.note-name.active { fill: var(--green); }
.center-letter { fill: var(--green); font-size: 64px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .lbl, .ring, .glow, .note-name { transition: none; } }
</style>
<link rel="stylesheet" href="../app.css">
<style>.titlebar .title { font-size: 20px; letter-spacing: .08em; }</style>

<main class="stage">
  <div class="topline">
    <span class="titlebar"><a class="home" href="../" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7M6.5 9.8V19.5h11V9.8"/></svg></a><span class="title">🔥🚸🌭</span><span class="module">Scale dial</span></span>
    <span id="soundMsg" class="sound-msg" role="status" hidden></span>
    <span class="heard" id="heard" role="status" aria-live="polite"></span>
    <label class="sens">Sensitivity <input id="sens" type="range" min="0" max="1" step="0.05" value="0.5"></label>
    <span class="meter" id="meter" aria-hidden="true"><span id="meterFill"></span></span>
    <button id="mic" class="sound mic" aria-pressed="false"><span class="dot"></span>Listen</button>
    <button id="sound" class="sound" aria-pressed="true">Sound on</button>
  </div>

  <div class="keys-wrap">
    <svg id="keys" viewBox="0 0 760 330" role="img" aria-label="Piano keys"></svg>
  </div>

  <div class="dial-wrap">
    <svg id="dialSvg" viewBox="-210 -210 420 420" aria-hidden="false">
      <defs>
        <!-- base plate: flat white with a seam -->
        <radialGradient id="plate" cx="50%" cy="45%" r="60%">
          <stop offset="0" stop-color="#fdfdfc"/><stop offset="1" stop-color="#f1f1ef"/>
        </radialGradient>
        <!-- concave dish: shadow on the upper-left inner wall, light pooling lower-right -->
        <radialGradient id="dish" cx="58%" cy="62%" r="62%">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".62" stop-color="#f8f8f7"/>
          <stop offset=".88" stop-color="#e9e9e6"/>
          <stop offset="1" stop-color="#d9d9d5"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#cfcfca"/><stop offset=".5" stop-color="#ececea"/><stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
        <linearGradient id="dimple" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d3d3ce"/><stop offset=".55" stop-color="#f1f1ef"/><stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
        <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2"/>
        </filter>
      </defs>
      <g id="names"></g>
      <g id="dial" class="dial" tabindex="0" role="slider" aria-label="Key" aria-valuemin="0" aria-valuemax="11">
        <circle class="focus-ring" r="136" fill="none" stroke="var(--green-soft)" stroke-width="3"/>
        <circle r="130" fill="url(#dish)" stroke="#9a9a95" stroke-width="1"/>
        <!-- inner wall shadow -->
        <circle r="127" fill="none" stroke="#c4c4bf" stroke-width="5" opacity=".3" filter="url(#soft)"/>
        <g id="rotor">
          <!-- finger dimple: moves with the dial, but its shading is counter-rotated in render()
               so the light always falls from the same side, like the dish around it -->
          <g id="dimpleShade" transform="translate(0,-88)">
            <circle r="16" fill="url(#dimple)" stroke="#d9d9d4" stroke-width=".75"/>
            <circle r="15" fill="none" stroke="#a9a9a4" stroke-width="2.5" opacity=".32" filter="url(#soft)" transform="translate(-1,-1.5)"/>
            <path d="M 4 15.5 A 16 16 0 0 0 14.5 5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".85"/>
          </g>
          <!-- full-face hit area so the dial turns from anywhere -->
          <circle r="134" fill="transparent"/>
        </g>
        <text id="center" class="lbl center-letter" filter="url(#redGlow)" y="2">C</text>
      </g>
    </svg>
  </div>
</main>

<script>
(() => {
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const STEPS = [2, 2, 1, 2, 2, 2, 1];
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // ---------- Keyboard: B3 … C5, with half-hidden A♯ and C♯ at the edges ----------
  const keysSvg = document.getElementById('keys');
  const PX = 20, PY = 14, W = 720 / 7, H = 300, BW = 60, BH = 182;
  const whites = [60, 62, 64, 65, 67, 69, 71]; // one octave, C4..B4 (the mic folds any octave onto it)
  const keyEls = []; // {midi, g}
  // no panel or rim: the keys sit straight on the surface, outlined by thin part lines
  const clip = el('clipPath', { id: 'bed' }, el('defs', {}, keysSvg));
  el('rect', { x: PX - 1, y: PY - 1, width: W * 7 + 2, height: H + 2, rx: 3 }, clip);
  const bed = el('g', { 'clip-path': 'url(#bed)' }, keysSvg);
  const defs = keysSvg.querySelector('defs');
  const wg = el('linearGradient', { id: 'whiteKey', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': '#f2f2f0' }, wg); el('stop', { offset: .12, 'stop-color': '#ffffff' }, wg); el('stop', { offset: 1, 'stop-color': '#fafaf9' }, wg);
  const bg = el('linearGradient', { id: 'blackKey', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': '#1f1f21' }, bg); el('stop', { offset: 1, 'stop-color': '#3a3a3d' }, bg);
  const glowF = el('filter', { id: 'keyGlow', x: '-80%', y: '-80%', width: '260%', height: '260%' }, defs);
  el('feGaussianBlur', { stdDeviation: 6 }, glowF);
  const pg = el('linearGradient', { id: 'pressShade', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': '#000', 'stop-opacity': .22 }, pg); el('stop', { offset: .18, 'stop-color': '#000', 'stop-opacity': .06 }, pg); el('stop', { offset: .4, 'stop-color': '#000', 'stop-opacity': 0 }, pg);

  function label(g, cx, cy, text, dark) {
    el('circle', { class: 'glow', cx, cy, r: 20, fill: 'var(--green)', opacity: 0, filter: 'url(#keyGlow)', style: 'fill-opacity:.45' }, g);
    el('circle', { class: 'ring', cx, cy, r: 17, fill: dark ? '#2f2f32' : '#fbfbfa', stroke: dark ? '#4a4a4e' : '#d6d6d1', 'stroke-width': 1.5 }, g);
    const t = el('text', { class: 'lbl', x: cx, y: cy + 1, 'font-size': text.length > 1 ? 14 : 17, fill: dark ? '#8d8d92' : 'var(--ink)' }, g);
    t.textContent = text;
  }

  whites.forEach((m, i) => {
    const g = el('g', { class: 'key', 'data-midi': m }, bed);
    const x = PX + i * W;
    el('rect', { x, y: PY, width: W, height: H, rx: 3, fill: 'url(#whiteKey)' }, g);
    el('rect', { class: 'hitfill', x, y: PY, width: W, height: H, rx: 3, fill: 'transparent' }, g);
    el('rect', { class: 'press', x, y: PY, width: W, height: H, rx: 3, fill: 'url(#pressShade)' }, g);
    el('rect', { x, y: PY, width: W, height: H, rx: 3, fill: 'none', stroke: '#8e8e89', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }, g);
    label(g, x + W / 2, PY + H - 42, NAMES[m % 12], false);
    keyEls.push({ midi: m, g });
  });
  // black keys sit on the boundary after these white keys (index into whites)
  const blacks = [[61, 1], [63, 2], [66, 4], [68, 5], [70, 6]];
  blacks.forEach(([m, boundary]) => {
    const g = el('g', { class: 'key black', 'data-midi': m }, bed);
    const cx = PX + boundary * W;
    const lx = cx;
    el('rect', { x: cx - BW / 2 - 1, y: PY, width: BW + 2, height: BH + 3, rx: 5, fill: '#000', opacity: .1 }, g);
    el('rect', { x: cx - BW / 2, y: PY, width: BW, height: BH, rx: 5, fill: 'url(#blackKey)', stroke: '#141416' }, g);
    el('rect', { class: 'hitfill', x: cx - BW / 2, y: PY, width: BW, height: BH, rx: 5, fill: 'transparent' }, g);
    el('rect', { class: 'press', x: cx - BW / 2, y: PY, width: BW, height: BH, rx: 5, fill: 'url(#pressShade)' }, g);
    label(g, lx, PY + BH - 32, NAMES[m % 12], true);
    keyEls.push({ midi: m, g });
  });
  // re-append black keys last so they draw on top
  keyEls.filter((k) => [1, 3, 6, 8, 10].includes(k.midi % 12)).forEach((k) => bed.appendChild(k.g));

  // ---------- Dial ----------
  const names = document.getElementById('names');
  const nameEls = NAMES.map((n, i) => {
    const a = (i * 30 - 90) * Math.PI / 180;
    el('circle', { cx: Math.cos(a) * 160, cy: Math.sin(a) * 160, r: 2, fill: '#c9c9c4' }, names);
    const t = el('text', { class: 'lbl note-name', x: Math.cos(a) * 186, y: Math.sin(a) * 186 }, names);
    t.textContent = n;
    t.style.cursor = 'pointer';
    t.addEventListener('click', () => { setKey(i, false); animateTo(nearestTurn(i * 30)); });
    return t;
  });
  const dial = document.getElementById('dial');
  const rotor = document.getElementById('rotor');
  const center = document.getElementById('center');
  let rotation = 0; // degrees, unbounded
  let key = 0;

  const dimpleShade = document.getElementById('dimpleShade');
  function render() {
    rotor.setAttribute('transform', `rotate(${rotation})`);
    dimpleShade.setAttribute('transform', `translate(0,-88) rotate(${-rotation})`);
  }
  function nearestTurn(target) {
    // same visual angle as target, closest to the current rotation
    return target + 360 * Math.round((rotation - target) / 360);
  }
  function setKey(k, play) {
    k = ((k % 12) + 12) % 12;
    const changed = k !== key;
    key = k;
    center.textContent = NAMES[k];
    center.setAttribute('font-size', NAMES[k].length > 1 ? 56 : 64);
    nameEls.forEach((t, i) => t.classList.toggle('active', i === k));
    const pcs = scalePcs = new Set();
    let p = k; pcs.add(p);
    STEPS.forEach((s) => { p = (p + s) % 12; pcs.add(p); });
    keyEls.forEach(({ midi, g }) => {
      g.classList.toggle('on', pcs.has(midi % 12));
      g.classList.toggle('root', midi % 12 === k);
    });
    dial.setAttribute('aria-valuenow', k);
    dial.setAttribute('aria-valuetext', `${NAMES[k]} major`);
    // (No click or scale playback on a key change; the highlights are enough.)
  }
  let anim = null;
  let target = 0;
  // Snap straight to the new key: no animation, no sound.
  function animateTo(to) {
    target = to;
    cancelAnimationFrame(anim);
    rotation = to;
    render();
  }

  const svg = document.getElementById('dialSvg');
  function angleOf(ev) {
    const r = svg.getBoundingClientRect();
    const x = ev.clientX - (r.left + r.width / 2);
    const y = ev.clientY - (r.top + r.height / 2);
    return Math.atan2(x, -y) * 180 / Math.PI; // 0 at top, clockwise
  }
  let drag = null;
  dial.addEventListener('pointerdown', (ev) => {
    unlock();
    cancelAnimationFrame(anim);
    dial.setPointerCapture(ev.pointerId);
    dial.classList.add('dragging');
    drag = { id: ev.pointerId, last: angleOf(ev) };
  });
  dial.addEventListener('pointermove', (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    const a = angleOf(ev);
    let d = a - drag.last;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    drag.last = a;
    rotation += d;
    render();
    setKey(Math.round(rotation / 30), false);
  });
  const end = (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    drag = null;
    dial.classList.remove('dragging');
    const snap = Math.round(rotation / 30) * 30;
    animateTo(snap);
    setKey(snap / 30, true);
  };
  dial.addEventListener('pointerup', end);
  dial.addEventListener('pointercancel', end);
  dial.addEventListener('keydown', (ev) => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[ev.key];
    if (!d) return;
    ev.preventDefault();
    unlock();
    const snap = Math.round(target / 30) * 30 + d * 30;
    animateTo(snap);
    setKey(snap / 30, true);
  });

  // ---------- Sound ----------
  let mic = null, micStarting = false;
  function setAudioSession(type) {
    try { if (navigator.audioSession && navigator.audioSession.type !== type) navigator.audioSession.type = type; } catch (e) { /* not supported */ }
  }
  let ctx = null, soundOn = true, cancelScale = [], scalePcs = new Set(), busyUntil = 0;
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  });
  function unlock() {
    // 'playback' keeps Silent mode from muting notes, but it forbids recording, so never
    // set it while (or just before) the microphone is in use.
    setAudioSession(mic || micStarting ? 'play-and-record' : 'playback');
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state !== 'running') {
      const b = ctx.createBufferSource();
      b.buffer = ctx.createBuffer(1, 1, 22050);
      b.connect(ctx.destination);
      b.start(0);
      ctx.resume().catch(() => {});
    }
    return ctx;
  }
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach((g) => window.addEventListener(g, unlock, true));
  // On iPad/iPhone, Web Audio is silenced by Silent mode, and inside apps (like the Claude app)
  // the page can't override that. Pre-rendered notes played through an <audio> element are
  // treated as media playback instead, so on iOS we always use those.
  const isIOS = /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const useHtmlAudio = isIOS;
  const wavCache = new Map();
  function noteWav(midi) {
    if (wavCache.has(midi)) return wavCache.get(midi);
    const sr = 22050, len = Math.floor(sr * 1.3), f = 440 * Math.pow(2, (midi - 69) / 12);
    const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
    v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, len * 2, true);
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const env = Math.min(1, t * 120) * Math.exp(-t * 3.2);
      // triangle-ish fundamental plus soft overtones
      const x = Math.sin(2 * Math.PI * f * t) + .3 * Math.sin(4 * Math.PI * f * t) + .1 * Math.sin(6 * Math.PI * f * t);
      v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x * env * .45)) * 32767, true);
    }
    // data: URL rather than blob:, since some hosts only allow data: media.
    const bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const url = 'data:audio/wav;base64,' + btoa(bin);
    wavCache.set(midi, url);
    return url;
  }
  // iPad: making a new <audio> element for every tap piles up decoders and makes Safari
  // lag, then play stale or garbled notes. Keep two reusable players per note instead.
  const players = new Map();
  function player(midi) {
    let pool = players.get(midi);
    if (!pool) {
      pool = [0, 1].map(() => { const a = new Audio(noteWav(midi)); a.setAttribute('playsinline', ''); a.preload = 'auto'; return a; });
      pool.next = 0;
      players.set(midi, pool);
    }
    const a = pool[pool.next];
    pool.next = (pool.next + 1) % pool.length;
    if (!a.paused) a.pause();
    return a;
  }
  function tone(midi, when = 0, dur = 1.2, vol = .22) {
    if (!soundOn) return;
    busyUntil = Math.max(busyUntil, performance.now() + (when + dur * .8) * 1000);
    if (useHtmlAudio) {
      const a = player(midi);
      const go = () => { try { a.currentTime = 0; } catch { /* not loaded yet */ } a.play().then(soundOk, soundBlocked); };
      if (when > 0) setTimeout(go, when * 1000); else go();
      return;
    }
    const c = unlock();
    if (!c) return;
    if (c.state === 'running') { webTone(midi, when, dur, vol); soundOk(); }
    else {
      c.resume().then(() => { webTone(midi, when, dur, vol); soundOk(); }).catch(soundBlocked);
      setTimeout(() => { if (c.state !== 'running') soundBlocked(); }, 800);
    }
  }
  // Tell the person on screen when the browser is refusing to play sound.
  const msg = document.getElementById('soundMsg');
  function soundOk() { msg.hidden = true; }
  // Mark asked for no pop-up text here; just note it for debugging.
  function soundBlocked() { console.warn('sound may be blocked'); }
  function webTone(midi, when, dur, vol) {
    const t = ctx.currentTime + when + .01;
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(vol * .3, t + .3);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    g.connect(ctx.destination);
    [[1, 'triangle', 1], [2, 'sine', .3], [3, 'sine', .1]].forEach(([m, type, a]) => {
      const o = ctx.createOscillator();
      o.type = type; o.frequency.value = f * m;
      const og = ctx.createGain(); og.gain.value = a;
      o.connect(og).connect(g);
      o.start(t); o.stop(t + dur + .05);
    });
  }
  function tick() {
    if (!soundOn || !ctx || useHtmlAudio || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 2400;
    g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.0001, t + .03);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .04);
  }
  function flash(midi) {
    const k = keyEls.find((x) => x.midi === midi);
    if (!k) return;
    k.g.style.opacity = .75;
    setTimeout(() => { k.g.style.opacity = ''; }, 180);
  }
  function playScale() {
    cancelScale.forEach(clearTimeout); cancelScale = [];
    let m = 60 + key;
    const notes = [m];
    STEPS.forEach((s) => { m += s; notes.push(m); });
    notes.forEach((n, i) => {
      tone(n, i * .22, .9);
      // light up the matching key on screen (same octave if shown, else any key with that name)
      cancelScale.push(setTimeout(() => {
        const on = keyEls.find((k) => k.midi === n) || keyEls.find((k) => k.midi % 12 === n % 12);
        if (on) flash(on.midi);
      }, i * 220));
    });
  }
  keyEls.forEach(({ midi, g }) => {
    g.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      tone(midi);
      heard(midi); // tapped keys light green (in the scale) or red (not in it), like played ones
      g.classList.add('pressed');
    });
    const up = () => { g.classList.remove('pressed'); };
    g.addEventListener('pointerup', up);
    g.addEventListener('pointerleave', up);
    g.addEventListener('pointercancel', up);
  });
  // Warm up the iPad note cache so the first tap isn't delayed.
  if (useHtmlAudio) setTimeout(() => keyEls.forEach(({ midi }) => player(midi)), 300);

  // ---------- Listening to a real piano ----------
  // Autocorrelation pitch detection: reliable for one note at a time.
  function detectPitch(buf, sr, full = true) {
    const n = buf.length;
    let rms = 0;
    for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / n);
    if (!full || rms < 0.0003) return { freq: -1, rms, clarity: 0 };
    const minLag = Math.floor(sr / 2100), maxLag = Math.min(Math.floor(sr / 62), n >> 1), size = n - maxLag;
    const nsdf = new Float32Array(maxLag + 1);
    let best = 0;
    for (let lag = minLag; lag <= maxLag; lag++) {
      let ac = 0, m = 0;
      for (let i = 0; i < size; i++) { const a = buf[i], b = buf[i + lag]; ac += a * b; m += a * a + b * b; }
      nsdf[lag] = m > 0 ? 2 * ac / m : 0;
      if (nsdf[lag] > best) best = nsdf[lag];
    }
    if (best < 0.5) return { freq: -1, rms, clarity: best };
    let lag = -1;
    for (let i = minLag + 1; i < maxLag; i++) {
      if (nsdf[i] >= best * 0.9 && nsdf[i] >= nsdf[i - 1] && nsdf[i] >= nsdf[i + 1]) { lag = i; break; }
    }
    if (lag < 0) return { freq: -1, rms, clarity: best };
    const a = nsdf[lag - 1], b = nsdf[lag], c = nsdf[lag + 1];
    const shift = (a - c) / (2 * (a - 2 * b + c) || 1);
    return { freq: sr / (lag + shift), rms, clarity: b };
  }

  const micBtn = document.getElementById('mic');
  const heardEl = document.getElementById('heard');
  const micDot = micBtn.querySelector('.dot');
  const meterFill = document.getElementById('meterFill');
  micBtn.addEventListener('click', async () => {
    if (mic) { stopMic(); return; }
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMicError({ name: 'NoApi' });
      return;
    }
    heardEl.textContent = 'Asking for the microphone…';
    // Make the listening context right here in the tap, so iPad lets it run.
    const AC = window.AudioContext || window.webkitAudioContext;
    const mctx = new AC();
    mctx.resume().catch(() => {});
    micStarting = true;
    setAudioSession('play-and-record');
    let stream;
    try {
      // Ask for the mic first, straight from the tap, before touching audio playback.
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      } catch (e) {
        if (e && (e.name === 'OverconstrainedError' || e.name === 'TypeError')) stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        else throw e;
      }
    } catch (e) {
      micStarting = false;
      setAudioSession('playback');
      mctx.close().catch(() => {});
      showMicError(e);
      return;
    }
    micStarting = false;
    try {
      const c = mctx;
      if (c.state !== 'running') await c.resume().catch(() => {});
      const src = c.createMediaStreamSource(stream);
      const an = c.createAnalyser();
      an.fftSize = 2048;
      // Safari only processes audio that reaches the speakers, so route the analyser
      // to the output through a silent gain node.
      const mute = c.createGain();
      mute.gain.value = 0;
      src.connect(an);
      an.connect(mute);
      mute.connect(c.destination);
      mic = { stream, ctx: c, an, buf: new Float32Array(2048), sr: c.sampleRate, candF: null, stable: 0, lo: 0, hi: 0, hist: [0, 0, 0], window: 0, quietFor: 0 };
      mic.timer = setInterval(listen, 16);
      micBtn.setAttribute('aria-pressed', 'true');
      micBtn.lastChild.textContent = 'Listening';
      document.body.classList.add('listening');
      heardEl.classList.remove('err');
      heardEl.textContent = 'Play a note on your piano';
    } catch (e) {
      stream.getTracks().forEach((t) => t.stop());
      showMicError({ name: 'AudioSetup', message: e && e.message });
    }
  });
  // Say which situation we're in, so it's clear what to change.
  function showMicError(e) {
    const name = (e && e.name) || 'Unknown';
    const inApp = isIOS && !/Safari\//.test(navigator.userAgent); // in-app browsers (e.g. inside the Claude app) drop "Safari/"
    let text;
    if (name === 'NoApi') {
      text = inApp
        ? 'This in-app browser can\'t use the microphone. Open this page in Safari (tap the compass/Safari icon, or copy the link into Safari).'
        : 'This browser can\'t use the microphone here. Open the page in Safari or Chrome.';
    } else if (name === 'NotAllowedError' || name === 'SecurityError') {
      text = inApp
        ? 'The app you opened this in isn\'t allowed to use the microphone. Open this page in Safari instead (tap the compass/Safari icon, or copy the link into Safari).'
        : isIOS
          ? 'Microphone is blocked for this site. In Safari tap “aA” (or the page icon) in the address bar → Website Settings → Microphone → Allow, then reload. Also check Settings → Apps → Safari → Microphone is set to Ask or Allow.'
          : 'Microphone is blocked for this site. Click the icon next to the address bar, allow the microphone, then reload.';
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      text = 'No microphone was found on this device.';
    } else if (name === 'NotReadableError' || name === 'AbortError') {
      text = 'Another app is using the microphone. Close it (or end the call) and tap Listen again.';
    } else {
      text = 'Couldn\'t start the microphone (' + name + '). Reload the page and tap Listen again.';
    }
    heardEl.textContent = text;
    heardEl.classList.add('err');
    console.warn('mic error', e);
  }
  function stopMic() {
    setAudioSession('playback');
    clearInterval(mic.timer);
    mic.stream.getTracks().forEach((t) => t.stop());
    mic.ctx.close().catch(() => {});
    meterFill.style.width = '0%';
    mic = null;
    micBtn.setAttribute('aria-pressed', 'false');
    micBtn.lastChild.textContent = 'Listen';
    document.body.classList.remove('listening');
    micDot.style.transform = '';
    heardEl.textContent = '';
  }
  function listen() {
    // iPad can pause ("interrupt") the context when the audio mode changes; wake it up.
    if (mic.ctx.state !== 'running') mic.ctx.resume().catch(() => {});
    mic.an.getFloatTimeDomainData(mic.buf);
    const { rms } = detectPitch(mic.buf, mic.sr, false);
    micDot.style.transform = `scale(${1 + Math.min(1.2, rms * 12)})`;
    // Level meter: log scale so quiet rooms still show movement.
    const lvl = rms > 0 ? Math.max(0, Math.min(1, (20 * Math.log10(rms) + 60) / 50)) : 0;
    meterFill.style.width = (lvl * 100).toFixed(0) + '%';
    if (rms < 0.0005) {
      mic.quietFor++;
      if (mic.quietFor === 190 && !heardEl.querySelector('b')) heardEl.textContent = 'The microphone isn\'t picking up any sound. Check nothing is covering it, then tap Listen off and on.';
    } else mic.quietFor = 0;
    // Only count a note just after a fresh key strike: a sharp jump in loudness opens a
    // short window. Ringing strings and the tail of the last note never jump, so they're ignored.
    // Loudness of just the newest ~10 ms, so a key strike shows up as a sharp jump even
    // while the previous note is still ringing.
    let e = 0;
    for (let i = mic.buf.length - 512; i < mic.buf.length; i++) e += mic.buf[i] * mic.buf[i];
    const now = Math.sqrt(e / 512);
    const before = mic.hist[0];
    mic.hist.push(now); mic.hist.shift();
    if (now > before * sens.ratio && now > sens.floor && mic.window < 20) { mic.window = 24; mic.candF = null; mic.stable = 0; }
    if (mic.window > 0) mic.window--;
    if (performance.now() < busyUntil) return; // don't "hear" our own speaker
    // The pitch analysis is the expensive part, so only run it just after a key strike.
    const { freq, clarity } = mic.window > 0 ? detectPitch(mic.buf, mic.sr, true) : { freq: -1, clarity: 0 };
    if (mic.window > 0 && freq > 0 && rms > sens.floor && clarity > sens.clarity) {
      // A piano note holds a rock-steady pitch; voices slide and wobble. Require a few
      // readings in a row that stay within a fraction of a semitone.
      const mf = 69 + 12 * Math.log2(freq / 440);
      if (mic.candF != null && Math.abs(mf - mic.candF) < 0.25) {
        mic.stable++; mic.lo = Math.min(mic.lo, mf); mic.hi = Math.max(mic.hi, mf);
      } else { mic.candF = mf; mic.stable = 1; mic.lo = mic.hi = mf; }
      if (mic.stable >= sens.frames && mic.hi - mic.lo < 0.3) {
        mic.window = 0;
        heard(Math.round((mic.lo + mic.hi) / 2));
      }
    } else { mic.candF = null; mic.stable = 0; }
  }
  // Sensitivity slider (0 = strict, 1 = catches everything). 0.5 matches the tuned defaults.
  const sensEl = document.getElementById('sens');
  const sens = {};
  function setSens(v) {
    const x = Math.max(0, Math.min(1, v));
    sens.ratio = 1.5 * Math.pow(1.35, 1 - 2 * x);   // loudness jump that counts as a strike: 2.0 .. 1.1
    sens.floor = 0.0008 * Math.pow(4, 1 - 2 * x);   // quietest sound considered: 0.0032 .. 0.0002
    sens.clarity = 0.7 + 0.1 * (1 - 2 * x);         // how clean the pitch must be: 0.8 .. 0.6
    sens.frames = x < 0.34 ? 4 : x < 0.67 ? 3 : 2;   // steady readings needed
    try { localStorage.setItem('dial-sens', String(x)); } catch { /* private mode */ }
  }
  let saved = NaN;
  try { saved = parseFloat(localStorage.getItem('dial-sens')); } catch { /* private mode */ }
  sensEl.value = Number.isFinite(saved) ? saved : 0.5;
  setSens(parseFloat(sensEl.value));
  sensEl.addEventListener('input', () => setSens(parseFloat(sensEl.value)));

  let hitTimer = null;
  function heard(midi) {
    const pc = ((midi % 12) + 12) % 12;
    // Light the matching key on screen (prefer the middle octave when a name appears twice).
    const matches = keyEls.filter((k) => k.midi % 12 === pc);
    const k = matches.find((x) => x.midi >= 60 && x.midi <= 71) || matches[0];
    const inScale = scalePcs.has(pc);
    keyEls.forEach((x) => x.g.classList.remove('hit-in', 'hit-out'));
    clearTimeout(hitTimer);
    if (k) {
      k.g.classList.add(inScale ? 'hit-in' : 'hit-out');
      hitTimer = setTimeout(() => k.g.classList.remove('hit-in', 'hit-out'), 1400);
    }
    heardEl.innerHTML = inScale
      ? `<b class="yes">${NAMES[pc]}</b> is in ${NAMES[key]} major`
      : `<b class="no">${NAMES[pc]}</b> is not in ${NAMES[key]} major`;
  }

  setKey(0, false);
  render();
})();
</script>
</body>
</html>
